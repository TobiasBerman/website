<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <title>Polar Coordinates</title>
    <style>
        :root {
            --primary: #3eba44;
            --dark1: #121212;
            --dark2: #1e1e1e;
            --dark3: #232323;
            --dark4: #252525;
            --dark5: #272727;
            --dark6: #2c2c2c;
            --dark7: #2f2f2f;
            --dark8: #333333;
            --dark9: #353535;
            --dark10: #383838;
            --dark11: #3a3a3a;
        }

        * {
            margin: 0 auto;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark2);
            overflow: hidden;
            font-family: "Quicksand", sans-serif;
        }

        canvas {
            width: 100vh;
            height: 100vh;
            max-width: 100vw;
            background-color: var(--dark2);
            display: block;
            margin: 0 auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #controls {
            position: fixed;
            top: 32px;
            left: 32px;
            z-index: 1000;
            background-color: var(--dark8);
            /* border: 2px solid var(--primary); */
            /* border-radius: 8px; */
            padding: 15px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
        }

        #controls input {
            background-color: var(--dark3);
            color: var(--primary);
            border: 0;
            /* border-radius: 4px; */
            padding: 8px 12px;
            font-size: 14px;
            width: 200px;
            outline: none;
        }

        #controls label {
            color: var(--primary);
            font-size: 18px;
            margin-bottom: 5px;
            display: block;
        }

        #controls .slider-container {
            margin-top: 16px;
        }

        noscript {
            text-align: center;
            color: var(--primary);
            background-color: var(--dark2);
            padding: 20px;
        }
    </style>
</head>
<body>
    <canvas id="myCanvas" width="1000px" height="1000px"></canvas>
    <div id="controls">
        <div class="slider-container">
            <label for="xInput">X Function:</label>
            <input id="xInput" placeholder="r * cos(x)" value="r * cos(x)">
        </div>
        <div class="slider-container">
            <label for="yInput">Y Function:</label>
            <input id="yInput" placeholder="r * sin(x)" value="r * sin(x)">
        </div>
        <div class="slider-container">
            <label for="decayInput">Decay Rate:</label>
            <input id="decayInput" placeholder="0" value="0">
        </div>
        <button id="updateGraphBtn" style="margin-top:18px;width:100%;padding:10px 0;background:var(--primary);color:var(--dark1);border:none;font-size:16px;font-family:inherit;cursor:pointer;border-radius:4px;">Update Graph</button>
    </div>
    <noscript>Turn on JavaScript my man...</noscript>
    <script src="script.js"></script>
</body>
</html>
